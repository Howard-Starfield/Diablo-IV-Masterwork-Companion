[package]
name = "diablo_masterwork_companion"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
eframe = "0.27.2"
futures-lite = "2.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
imageproc = { version = "0.27.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strsim = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
windows = { version = "0.62.2", features = ["Globalization", "Media_Ocr", "Graphics_Imaging", "Security_Cryptography", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
xcap = "0.9.4"

[build-dependencies]
winresource = "0.1.22"

[[bin]]
name = "macro_detection_bench"
path = "src/bin/macro_detection_bench.rs"
test = false
bench = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
